[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lzr-labeler"
version = "0.2.0"
description = "Desktop image annotation with PySide6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7", "numpy>=2,<3"]

[project.optional-dependencies]
ai = ["torch>=2.9,<3", "torchvision>=0.24,<1"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.gui-scripts]
lzr-labeler = "lzr_labeler.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lzr_labeler = ["assets/fonts/*", "assets/icons/*", "assets/infos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

